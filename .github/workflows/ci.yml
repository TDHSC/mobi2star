name: native-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable compiler
        run: rustup default stable
      - name: Run the native quality gate
        run: ./tools/qa.sh
      - name: Build native release binary
        run: cargo build -p mobi2star --release --locked
      - name: Upload native binary after checks
        uses: actions/upload-artifact@v7
        with:
          name: mobi2star-${{ runner.os }}-${{ runner.arch }}
          path: target/release/mobi2star
  web:
    # The browser build and its comparison with the CLI; see web.yml.
    uses: ./.github/workflows/web.yml
  msrv:
    # Keep in sync with rust-version in Cargo.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the minimum supported Rust
        run: rustup toolchain install 1.85 --profile minimal
      - name: Test on the minimum supported Rust
        run: cargo +1.85 test --workspace --locked
