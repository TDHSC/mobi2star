<!doctype html>
<!-- The document the preview draws entries into. It has no script: the page
     fills it and handles its links. Its policy is stricter than the page's:
     entries may carry inline styles and inlined images, and nothing else. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Preview</title>
</head>
<body></body>
</html>
