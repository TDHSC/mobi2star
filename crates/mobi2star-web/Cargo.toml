[package]
name = "mobi2star-web"
description = "The converter behind the mobi2star browser page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Not the workspace's `forbid`: wasm-bindgen's generated glue is unsafe code,
# so only the bindings module allows it.
[lints.rust]
unsafe_code = "deny"

[dependencies]
mobi2star.workspace = true
lexicon-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# Native builds (tests, clippy, the MSRV job) never compile these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
